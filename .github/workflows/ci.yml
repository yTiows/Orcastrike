# Lint, tests, secret scan, generated-doc check and both launchers, on Linux and Windows.
# Windows is in the matrix because the first real Windows run found path bugs Linux can't show.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the secret scan checks the full history
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run audit:secrets
      - run: node scripts/gen-config-doc.mjs --check
      - name: Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: Orcastrike.cmd doctor < NUL
      - name: Launcher (Linux)
        if: runner.os != 'Windows'
        run: ./orcastrike.sh doctor
